[build]
  publish = "dist"
  # Generates dist/library/data from the texts in sources/
  command = "node scripts/build-library.mjs && node scripts/test-interlinear-publication.mjs && node scripts/test-beit-yaakov-publication.mjs"

# Keep the real preview PDFs served as PDFs. The homepage polish is handled
# by the edge function in netlify/edge-functions/site-polish.ts.
[[headers]]
  for = "/Takanas_HaShavin_Volume_I_Siman_Aleph.pdf"
  [headers.values]
    X-Content-Type-Options = "nosniff"

[[headers]]
  for = "/Livyasan_Shavuos_Preview.pdf"
  [headers.values]
    X-Content-Type-Options = "nosniff"

[[headers]]
  for = "/Dover_Tzedek_Two_Volume_Preview.pdf"
  [headers.values]
    X-Content-Type-Options = "nosniff"

# Web app: always check for a new service worker and manifest.
[[headers]]
  for = "/library/sw.js"
  [headers.values]
    Cache-Control = "no-cache"
    Service-Worker-Allowed = "/library/"

[[headers]]
  for = "/library/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"
    Cache-Control = "no-cache"
