[build]
  publish = "dist"

[[headers]]
  for = "/assets/rooted-ascent.webp"
  [headers.values]
    Content-Type = "image/png"

[[headers]]
  for = "/assets/quiet-threshold.webp"
  [headers.values]
    Content-Type = "image/png"

[[headers]]
  for = "/assets/takanas-set.webp"
  [headers.values]
    Content-Type = "image/png"

[[headers]]
  for = "/assets/takanas-page-intro.webp"
  [headers.values]
    Content-Type = "image/png"

[[headers]]
  for = "/assets/takanas-page-siman.webp"
  [headers.values]
    Content-Type = "image/png"

[[headers]]
  for = "/assets/takanas-promo-2.webp"
  [headers.values]
    Content-Type = "image/png"

[[headers]]
  for = "/assets/livyasan-page.webp"
  [headers.values]
    Content-Type = "image/jpeg"

[[headers]]
  for = "/assets/dover-eruvin-page.webp"
  [headers.values]
    Content-Type = "image/png"

[[headers]]
  for = "/assets/dover-vol1.webp"
  [headers.values]
    Content-Type = "image/svg+xml; charset=utf-8"

[[headers]]
  for = "/previews/*.pdf"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Content-Type = "application/pdf"
