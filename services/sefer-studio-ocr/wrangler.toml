name = "sefer-studio-ocr"
main = "src/worker.js"
compatibility_date = "2026-11-17"
workers_dev = true
preview_urls = false
upload_source_maps = false

# Public configuration only. Put both credentials in encrypted Worker secrets.
[vars]
OPENAI_MODEL = "gpt-5.5"
ALLOWED_ORIGINS = "https://akivagutnicki-crypto.github.io"

# Pick an unused positive namespace ID in the deployment account.
# Cloudflare counters are approximate and per location, not a global budget.
[[ratelimits]]
name = "OCR_RATE_LIMITER"
namespace_id = "76117001"
simple = { limit = 5, period = 60 }

[observability]
enabled = false
