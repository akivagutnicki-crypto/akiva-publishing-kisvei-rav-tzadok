name: Validate reviewed Pri Tzaddik footnote enhancements
on:
  push:
    branches: ["pri-tzadik-selective-footnote-upgrade"]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - run: node scripts/build-pages.mjs
      - run: node scripts/import-tzidkat-reviewed.mjs
      - run: node scripts/import-tzidkat-parallels.mjs
      - run: python scripts/import-tzidkat-expanded-2096.py
      - run: node scripts/import-mei-vayera-bo.mjs
      - run: node scripts/import-machshavot-charutz.mjs
      - run: python scripts/import-divrei-footnotes.py
      - run: node scripts/build-library.mjs
      - run: node scripts/import-pri-selective-footnotes.mjs
      - run: node scripts/test-pri-selective-footnotes.mjs
      - run: node scripts/test-pri-bereishis3-commentary.mjs
      - run: node scripts/test-pri-tzadik-annotations.mjs
      - run: node scripts/test-pri-rosh-chodesh-annotations.mjs
