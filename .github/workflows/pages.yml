name: Deploy Akiva Publishing to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Expand Tzidkat HaTzadik source footnotes
        run: node scripts/expand-tzidkat-footnotes.mjs

      - name: Build library
        run: npm run build

      - name: Verify Tzidkat HaTzadik footnotes
        run: npm run test:tzidkat-footnotes

      - name: Verify reader data
        run: npm run test:reader-data

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Verify Tzidkat reader in headless browser
        run: npm run test:tzidkat-reader-browser

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
