name: Deploy Akiva Publishing to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  # Skipped workflows must not displace a pending publisher in the shared queue.
  group: ${{ (github.event_name != 'push' || (!contains(github.event.head_commit.message, '[divrei-source-release]') && !contains(github.event.head_commit.message, '[divrei-media-release]') && !contains(github.event.head_commit.message, '[reader-ui-release]') && !contains(github.event.head_commit.message, '[share-release]') && !contains(github.event.head_commit.message, '[mei-volume-ii-release]') && !contains(github.event.head_commit.message, '[mei-likutei-release]') && !contains(github.event.head_commit.message, '[tzidkat-accuracy-release]') && !contains(github.event.head_commit.message, '[tzidkat-source-attribution]') && !contains(github.event.head_commit.message, '[tzidkat-accuracy-rebuild-integration]') && !contains(github.event.head_commit.message, '[new-books-release]') && !contains(github.event.head_commit.message, '[tzidkat-batch-review]') && !contains(github.event.head_commit.message, '[divrei-zip-refresh]') && !contains(github.event.head_commit.message, '[tzidkat-download-refresh]') && !contains(github.event.head_commit.message, '[tzidkat-source-addition]') && !contains(github.event.head_commit.message, '[pri-parsha-review]') && !contains(github.event.head_commit.message, '[tzidkat-reader-json]') && !contains(github.event.head_commit.message, '[beit-yaakov-reader-json]') && !contains(github.event.head_commit.message, '[beit-headlines-zip]'))) && 'pages' || format('pages-skipped-{0}', github.run_id) }}
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ github.event_name != 'push' || (!contains(github.event.head_commit.message, '[divrei-source-release]') && !contains(github.event.head_commit.message, '[divrei-media-release]') && !contains(github.event.head_commit.message, '[reader-ui-release]') && !contains(github.event.head_commit.message, '[share-release]') && !contains(github.event.head_commit.message, '[mei-volume-ii-release]') && !contains(github.event.head_commit.message, '[mei-likutei-release]') && !contains(github.event.head_commit.message, '[tzidkat-accuracy-release]') && !contains(github.event.head_commit.message, '[tzidkat-source-attribution]') && !contains(github.event.head_commit.message, '[tzidkat-accuracy-rebuild-integration]') && !contains(github.event.head_commit.message, '[new-books-release]') && !contains(github.event.head_commit.message, '[tzidkat-batch-review]') && !contains(github.event.head_commit.message, '[divrei-zip-refresh]') && !contains(github.event.head_commit.message, '[tzidkat-download-refresh]') && !contains(github.event.head_commit.message, '[tzidkat-source-addition]') && !contains(github.event.head_commit.message, '[pri-parsha-review]') && !contains(github.event.head_commit.message, '[tzidkat-reader-json]') && !contains(github.event.head_commit.message, '[beit-yaakov-reader-json]') && !contains(github.event.head_commit.message, '[beit-headlines-zip]')) }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node for reader browser verification
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Build static site
        run: node scripts/build-pages.mjs

      - name: Verify library homepage grouping and donation placement
        run: node scripts/test-library-home-layout.mjs

      - name: Import supplied Tzidkat HaTzadik expanded source footnotes
        run: node scripts/import-tzidkat-reviewed.mjs

      - name: Import collated English parallels into Tzidkat footnotes
        run: node scripts/import-tzidkat-parallels.mjs

      - name: Apply supplied 2,096 deduplicated Tzidkat footnotes and Sefaria parallels
        run: python scripts/import-tzidkat-expanded-2096.py

      - name: Import Mei HaShiloach Vayera to Bo translation and source annotations
        run: node scripts/import-mei-vayera-bo.mjs

      - name: Import reviewed Machshavot Charutz expanded English footnotes
        run: node scripts/import-machshavot-charutz.mjs

      - name: Import Divrei Soferim Har Bracha and expanded source footnotes
        run: python scripts/import-divrei-footnotes.py

      - name: Build library text data
        run: node scripts/build-library.mjs

      - name: Verify new Pri Tzaddik Vayera and Chayei Sara reader content and navigation
        run: node scripts/test-pri-vayera-chayei-reader.mjs

      - name: Verify all Likkutei Maamarim expanded English source footnotes
        run: node scripts/test-likkutei-footnotes.mjs

      - name: Validate 729 Sichat Malakhei HaSharet Hebrew-only English source footnotes
        run: node scripts/test-sichat-footnotes.mjs

      - name: Validate 116 Sichat Shedim English source notes with Hebrew-only anchors
        run: node scripts/test-shedim-footnotes.mjs

      - name: Validate 925 Poked Akarim Hebrew-only source footnotes
        run: node scripts/test-poked-footnotes.mjs

      - name: Validate all 1,687 Ohr Zarua LaTzadik Hebrew-anchored footnotes
        run: node scripts/test-ohr-zarua-footnotes.mjs

      - name: Validate all 242 Divrei Chalomot English source footnotes and Hebrew anchors
        run: node scripts/test-divrei-chalomot-footnotes.mjs

      - name: Validate all 1,619 Kometz HaMinchah Hebrew-anchored footnotes
        run: node scripts/test-kometz-footnotes.mjs

      - name: Add selectively reviewed Pri Tzaddik footnotes without overwriting original Word notes
        run: node scripts/import-pri-selective-footnotes.mjs && node scripts/test-pri-selective-footnotes.mjs

      - name: Fill footnotes in all 69 interlinear Pri Tzaddik sections and verify Hebrew anchors
        run: node scripts/import-pri-all-footnotes.mjs && node scripts/import-pri-expanded-parallels.mjs && node scripts/test-pri-full-coverage.mjs && node scripts/test-pri-expanded-parallels.mjs

      - name: Verify annotated Pri Tzaddik Noach homepage, reader, and downloads
        run: node scripts/test-noach-home-links.mjs && node scripts/test-pri-tzadik-annotations.mjs

      - name: Verify Pri Tzaddik Mar Cheshvan and Bereishis Ois 4 home links
        run: node scripts/test-pri-marcheshvan-bereishis-home.mjs && node scripts/test-pri-rosh-chodesh-annotations.mjs

      - name: Verify annotated Bereishis Ois Gimmel source commentary
        run: node scripts/test-pri-bereishis3-commentary.mjs

      - name: Import Yisrael Kedoshim English footnotes and Sefaria links
        run: node scripts/import-yisrael-footnotes.mjs

      - name: Verify Yisrael Kedoshim Hebrew anchors and links
        run: node scripts/test-yisrael-footnotes.mjs

      - name: Prepare and verify the supplied shiur recordings
        run: node scripts/build-shiur-audio.mjs && node scripts/test-shiur-player.mjs && node scripts/test-noach6-media.mjs

      - name: Verify interlinear Hebrew, nikkud, and Sefaria links
        run: node scripts/test-interlinear-publication.mjs && node scripts/test-beit-yaakov-publication.mjs && node scripts/test-mei-shiloach-publication.mjs && node scripts/test-tzidkat.mjs && node scripts/test-tzidkat-footnotes.mjs && node scripts/test-tzidkat-parallels.mjs && node scripts/test-machshavot-footnotes.mjs && node scripts/test-divrei-footnotes.mjs && node scripts/test-hazikhronot-footnotes.mjs

      - name: Verify Hebrew-word footnotes in a mobile browser
        run: |
          npm install --no-save --package-lock=false playwright@1.62.1 jsdom@26.1.0
          npx playwright install --with-deps chromium
          node scripts/test-pri-word-footnote-browser.mjs
          node scripts/test-pri-full-coverage-browser.mjs
          node scripts/test-machshavot-reader-browser.mjs
          node scripts/test-tzidkat-reader-browser.mjs
          node scripts/test-divrei-reader-browser.mjs
          node scripts/test-hazikhronot-reader-browser.mjs
          node scripts/test-poked-reader-browser.mjs
          node scripts/test-ohr-zarua-reader-browser.mjs
          node scripts/test-divrei-chalomot-reader-browser.mjs
          node scripts/test-sichat-reader-browser.mjs
          node scripts/test-shedim-reader-browser.mjs

      - name: Reassemble and checksum verified 13-volume archives
        run: python scripts/assemble-akiva-reader-13.py

      - name: Apply fixed 13-volume annotated reader release when archive is staged
        run: python scripts/apply-reader-expanded-13.py
      - name: Verify Pri Tzaddik new Vayera and Chayei Sara content survives the 13-volume archive
        run: node scripts/test-pri-vayera-chayei-reader.mjs --after-archive

      - name: Install Meshiv HaTaanah and Meshiv Tzedek expanded Hebrew-anchored source footnotes
        run: python scripts/apply-meshiv-2026.py

      - name: Add editorial section titles and source-grounded thematic subheadings to six seforim
        run: python scripts/apply-six-torah-headings.py && node scripts/test-six-torah-headings.mjs && node scripts/test-six-headings-reader-browser.mjs

      - name: Publish and verify English descriptive contents and in-text headings in seven sefarim
        run: python scripts/apply-seven-editorial-tocs.py && node scripts/test-seven-editorial-tocs.mjs

      - name: Add 929 supplied Hebrew-anchored notes only to Pri Tzadik Vayera and Chayei Sara
        run: python scripts/import-pri-vayera-chayei-footnotes.py

      - name: Publish uploaded Pri Tzaddik Toldos before later imports record preservation checks
        run: node scripts/publish-pri-toldos.mjs

      - name: Publish checked Kedushas Shabbos and Kuntres Shevisas Shabbos interlinear editions
        run: node scripts/publish-pri-shabbos.mjs

      - name: Publish uploaded Pri Tzaddik Shevat and Tu BiShvat interlinear teachings after archive imports
        run: node scripts/publish-pri-shevat-tubishvat.mjs && node scripts/test-pri-shevat-tubishvat.mjs

      - name: Build and verify MCP search index and library parallels
        run: node scripts/build-mcp-index.mjs && node scripts/test-pri-toldos.mjs && node scripts/build-parallels.mjs && node scripts/test-parallels.mjs && node scripts/test-mcp-server.mjs && node scripts/test-cloudflare-worker.mjs

      - name: Publish and verify Et HaOchel translated source footnotes and unique parallels
        run: node scripts/publish-et-haochel.mjs && node scripts/test-parallels.mjs && node scripts/test-et-haochel-reader-browser.mjs

      - name: Verify supplied Bais Yaakov Vayera and Chayei Sarah documents in the final reader
        run: node scripts/test-beit-yaakov-documents.mjs && node scripts/test-beit-yaakov-vayera-gap.mjs && node scripts/test-beit-yaakov-documents-browser.mjs

      - name: Verify final Pri Tzadik footnote content and mobile and desktop popups
        run: |
          python scripts/import-pri-vayera-chayei-footnotes.py
          node scripts/test-pri-vayera-chayei-reader.mjs --after-archive
          node scripts/test-pri-vayera-chayei-footnotes-browser.mjs

      - name: Verify final Pri Tzaddik Shevat and Tu BiShvat source text connections and reader navigation
        run: node scripts/test-pri-shevat-tubishvat.mjs --final && node scripts/test-pri-shevat-tubishvat-browser.mjs

      - name: Publish supplied Dover Tzedek revisions and Hebrew citation links
        run: |
          python scripts/publish-dover-revisions.py
          node scripts/build-mcp-index.mjs
          node scripts/build-parallels.mjs
          node scripts/test-dover-revisions.mjs

      - name: Merge supplied Kislev Chanukah Shevat and Tu BiShvat source footnotes
        run: |
          python scripts/import-pri-seasonal-footnotes.py
          node scripts/build-mcp-index.mjs
          node scripts/test-mcp-server.mjs
          node scripts/test-pri-seasonal-footnotes.mjs

      - name: Add supplied source notes to the 26 Pri Tzaddik interlinear sections without footnotes
        run: |
          node scripts/import-pri-missing-footnotes.mjs
          python scripts/import-pri-seasonal-footnotes.py
          node scripts/build-mcp-index.mjs
          node scripts/test-pri-missing-footnotes.mjs
          node scripts/test-pri-seasonal-footnotes.mjs --data-only

      - name: Verify complete Dover Tzedek quotations after all final imports
        run: node scripts/test-dover-footnotes.mjs

      - name: Publish independently reviewed Chanukah 25 after the historical note numbers are fixed
        run: |
          node scripts/pri-chanukah25.mjs
          python scripts/import-pri-seasonal-footnotes.py
          node scripts/build-mcp-index.mjs
          node scripts/test-pri-chanukah25.mjs
          node scripts/test-pri-missing-footnotes.mjs
          node scripts/test-pri-seasonal-footnotes.mjs --data-only

      - name: Remove appended footnote parallels after all source imports
        run: |
          node scripts/test-strip-appended-parallels.mjs
          node scripts/test-finalize-parallel-cleanup.mjs
          node scripts/finalize-parallel-cleanup.mjs --write
          node scripts/test-pri-seasonal-footnotes.mjs --after-parallel-cleanup --data-only
          node scripts/test-pri-vayera-chayei-footnotes-browser.mjs --after-parallel-cleanup --data-only
          node scripts/test-dover-footnotes.mjs

      - name: Seal cleanup proof and verify both finalized Shabbos works
        run: |
          node scripts/finalize-parallel-cleanup.mjs --seal --write
          node scripts/test-pri-shabbos.mjs
          node scripts/test-pri-shabbos-browser.mjs

      - name: Verify the newly added Pri Tzaddik notes and Hebrew footnote popups after final cleanup
        run: |
          node scripts/test-pri-missing-footnotes.mjs --after-parallel-cleanup
          node scripts/test-pri-missing-footnotes-browser.mjs

      - name: Build and verify library ZIP downloads
        run: node scripts/build-library-zips.mjs && node scripts/test-library-zips.mjs && node scripts/test-sefaria-packs.mjs && node scripts/test-source-zip-export.mjs

      - name: Rebuild and verify MCP data from the final cleaned library and download manifest
        run: |
          node scripts/build-mcp-index.mjs
          node scripts/test-mcp-server.mjs
          node scripts/test-cloudflare-worker.mjs

      - name: Verify all newly added Pri Tzaddik notes in the final reader and both ZIP downloads
        run: node scripts/test-pri-missing-footnotes.mjs --after-parallel-cleanup --zips

      - name: Verify final cleanup proof protected editions and download consistency
        run: |
          node scripts/test-parallel-cleanup-publication.mjs --final > parallel-cleanup-final-verification.json
          cat parallel-cleanup-final-verification.json

      - name: Verify both Shabbos works and their exact Word edition in offline downloads
        run: node scripts/test-pri-shabbos.mjs --zips

      - name: Verify Bais Yaakov original documents in offline downloads
        run: node scripts/test-beit-yaakov-documents.mjs --zips && node scripts/test-beit-yaakov-vayera-gap.mjs --zips

      - name: Verify seasonal source notes preserved chapters and exact Word editions in offline downloads
        run: node scripts/test-pri-seasonal-footnotes.mjs --after-parallel-cleanup --zips

      - name: Verify revised Dover Tzedek source notes in offline downloads
        run: node scripts/test-dover-revisions.mjs --zips --data-only

      - name: Verify Toldos survives final imports and offline packaging
        run: node scripts/test-pri-toldos.mjs

      - name: Publish the reviewed source-quotation successor after all historical edition checks
        run: |
          python scripts/materialize-source-quotation-payload.py
          python scripts/publish-supplied-source-footnotes.py --write
          python scripts/publish-supplied-source-footnotes.py --write > source-quotation-repeat-verification.json
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path('source-quotation-repeat-verification.json').read_text())
          assert report['mode'] == 'already-applied', 'A repeated source-quotation publication must be a no-op'
          print('PASS source-quotation publisher is idempotent')
          PY

      - name: Rebuild downloads and MCP indexes from the final supplied source quotations
        run: |
          node scripts/build-library-zips.mjs
          node scripts/test-library-zips.mjs
          node scripts/test-sefaria-packs.mjs
          node scripts/test-source-zip-export.mjs
          node scripts/build-mcp-index.mjs
          node scripts/refresh-source-quotation-mcp.mjs
          node scripts/test-mcp-server.mjs
          node scripts/test-cloudflare-worker.mjs

      - name: Verify every final source quotation its exact predecessor protected books and reader interaction
        run: |
          python scripts/verify-supplied-source-footnotes.py --zips --mcp --browser > supplied-source-footnotes-final-verification.json
          cat supplied-source-footnotes-final-verification.json
          node scripts/test-dover-revisions.mjs --zips --data-only

      - name: Restore the authoritative Chanukah 24 boundary and preserve displaced source-note history
        run: |
          node scripts/pri-chanukah24-boundary.mjs
          node scripts/pri-chanukah24-boundary.mjs --verify > chanukah24-boundary-verification.json
          node scripts/build-library-zips.mjs
          node scripts/test-library-zips.mjs
          node scripts/test-sefaria-packs.mjs
          node scripts/test-source-zip-export.mjs
          node scripts/build-mcp-index.mjs
          node scripts/refresh-source-quotation-mcp.mjs
          node scripts/test-mcp-server.mjs
          node scripts/test-cloudflare-worker.mjs
          python scripts/verify-supplied-source-footnotes.py --zips --mcp --browser > supplied-source-footnotes-final-verification.json
          node scripts/test-pri-chanukah25.mjs --zips

      # This proof also compares the complete historical catalog bytes. Run it
      # before the authorized Dover successor changes that catalog; the Dover
      # verifier then proves all other sefarim remain byte-for-byte unchanged.
      - name: Verify historical Chanukah catalog and offline preservation before the Dover successor
        run: |
          node scripts/test-pri-chanukah25.mjs --zips > chanukah25-final-verification.json
          cat chanukah25-final-verification.json

      - name: Publish collated quotation-only Shabbos source notes after historical edition checks
        run: |
          node scripts/publish-pri-shabbos-quoted-sources.mjs > pri-shabbos-quoted-sources-publication-verification.json
          node scripts/publish-pri-shabbos-quoted-sources.mjs > pri-shabbos-quoted-sources-repeat-verification.json
          node --input-type=module -e "import fs from 'node:fs'; import assert from 'node:assert/strict'; assert.equal(JSON.parse(fs.readFileSync('pri-shabbos-quoted-sources-repeat-verification.json')).mode, 'already-applied');"
          node scripts/test-pri-shabbos-quoted-sources.mjs > pri-shabbos-quoted-sources-data-verification.json

      - name: Publish the supplied Bais Yaakov Toldos document after historical edition checks
        run: |
          node scripts/publish-beit-toldos.mjs
          node scripts/test-beit-toldos.mjs
          node scripts/test-beit-toldos-browser.mjs

      - name: Publish reviewed seasonal quotations and matching KDP print editions
        run: |
          python scripts/test-pri-seasonal-print.py > pri-seasonal-print-verification.json
          node scripts/publish-pri-seasonal-quoted-sources.mjs > pri-seasonal-quoted-sources-publication-verification.json
          node scripts/publish-pri-seasonal-quoted-sources.mjs > pri-seasonal-quoted-sources-repeat-verification.json
          node --input-type=module -e "import fs from 'node:fs'; import assert from 'node:assert/strict'; assert.equal(JSON.parse(fs.readFileSync('pri-seasonal-quoted-sources-repeat-verification.json')).mode, 'already-applied');"
          node scripts/test-pri-seasonal-quoted-sources.mjs > pri-seasonal-quoted-sources-data-verification.json

      - name: Publish reviewed quotations from all four supplied Tzidkat source editions
        run: |
          node scripts/test-tzidkat-publication-guards.mjs
          node scripts/publish-tzidkat-quoted-sources.mjs > tzidkat-quoted-sources-publication-verification.json
          node scripts/publish-tzidkat-quoted-sources.mjs > tzidkat-quoted-sources-repeat-verification.json
          node --input-type=module -e "import fs from 'node:fs'; import assert from 'node:assert/strict'; assert.equal(JSON.parse(fs.readFileSync('tzidkat-quoted-sources-repeat-verification.json')).mode, 'already-applied');"
          node scripts/test-tzidkat-quoted-sources.mjs > tzidkat-quoted-sources-data-verification.json

      - name: Publish the latest two Dover Tzedek KDP Word manuscripts after historical edition checks
        run: |
          node scripts/publish-dover-kdp.mjs
          node scripts/build-mcp-index.mjs
          node scripts/build-parallels.mjs
          node scripts/check-dover-source-links.mjs
          node scripts/build-library-zips.mjs
          node scripts/test-dover-kdp.mjs --zips
          node scripts/test-beit-toldos.mjs --zips --mcp --after-seasonal-quotes --after-tzidkat-quotes
          node scripts/test-pri-shabbos-quoted-sources.mjs --zips --mcp > pri-shabbos-quoted-sources-final-verification.json
          node scripts/test-pri-seasonal-quoted-sources.mjs --zips --mcp > pri-seasonal-quoted-sources-final-verification.json
          node scripts/test-tzidkat-quoted-sources.mjs --zips --mcp > tzidkat-quoted-sources-final-verification.json

      - name: Publish complete Vayeitzei and remaining Mei HaShiloach after predecessor preservation checks
        run: |
          node scripts/publish-reader-docx-import.mjs
          node scripts/publish-reader-docx-import.mjs > reader-docx-import-repeat-verification.json
          node --input-type=module -e "import fs from 'node:fs'; import assert from 'node:assert/strict'; assert.equal(JSON.parse(fs.readFileSync('reader-docx-import-repeat-verification.json')).mode, 'already-applied');"
          node scripts/build-mcp-index.mjs
          node scripts/build-parallels.mjs
          node scripts/build-library-zips.mjs
          node scripts/build-mcp-index.mjs
          node scripts/test-reader-docx-import.mjs --zips --mcp > reader-docx-import-verification.json
          cat reader-docx-import-verification.json
          node scripts/test-beit-toldos.mjs --zips --mcp --after-seasonal-quotes --after-tzidkat-quotes --after-docx-import
          node scripts/test-dover-kdp.mjs --zips

      - name: Build and verify reviewed connections against the final canonical source edition
        run: |
          node scripts/build-reviewed-connections.mjs
          node scripts/build-source-translations.mjs
          node scripts/build-connected-ideas.mjs
          node scripts/build-theme-review-progress.mjs
          node scripts/test-tzidkat-comprehensive-review.mjs --require-complete > tzidkat-comprehensive-review-verification.json
          cat tzidkat-comprehensive-review-verification.json
          node scripts/test-reviewed-connections.mjs > reviewed-source-connections-verification.json
          cat reviewed-source-connections-verification.json
          node scripts/test-source-translations.mjs > source-translations-verification.json
          cat source-translations-verification.json
          node scripts/test-reviewed-connections-reader.mjs
          node scripts/test-reviewed-source-rendering.mjs

      - name: Verify exact source editions and reviewed section threads across the library
        run: |
          node scripts/test-source-editions.mjs > source-editions-verification.json
          cat source-editions-verification.json
          node scripts/test-source-edition-cache.mjs
          node scripts/test-connected-ideas.mjs > connected-ideas-verification.json
          cat connected-ideas-verification.json
          node scripts/test-connected-ideas-context.mjs --output=connected-ideas-context-verification.json
          node scripts/test-theme-review-progress.mjs > theme-review-progress-verification.json
          cat theme-review-progress-verification.json
          node scripts/test-theme-candidates.mjs > theme-candidate-verification.txt
          cat theme-candidate-verification.txt
          node scripts/test-connection-footnotes-dom.mjs
          node scripts/test-connected-ideas-reader.mjs
          node scripts/test-seasonal-connections-release.mjs > seasonal-connections-final-verification.json
          cat seasonal-connections-final-verification.json

      - name: Verify Chanukah 25 source popups after the connection catalogs are built
        run: node scripts/test-pri-chanukah25-browser.mjs

      - name: Verify all collated Shabbos quotations and Hebrew markers on desktop and mobile
        run: node scripts/test-pri-shabbos-quoted-sources-browser.mjs

      - name: Verify seasonal quotations, Hebrew markers and print links on desktop and mobile
        run: node scripts/test-pri-seasonal-quoted-sources-browser.mjs

      - name: Verify Tzidkat quotations and preserved supplemental numbering on desktop and mobile
        run: |
          node scripts/test-tzidkat-quoted-sources.mjs --zips --mcp --connections > tzidkat-quoted-sources-connections-verification.json
          node scripts/test-tzidkat-quoted-sources-browser.mjs

      - name: Verify Vayeitzei and Mei HaShiloach text navigation and source links on desktop and mobile
        run: node scripts/test-reader-docx-import-browser.mjs

      - name: Publish the complete Divrei Soferim source audit after all predecessor checks
        run: |
          node scripts/publish-divrei-source-audit.mjs > divrei-source-audit-publication.json
          node scripts/publish-divrei-source-audit.mjs > divrei-source-audit-repeat.json
          node --input-type=module -e "import fs from 'node:fs'; import assert from 'node:assert/strict'; assert.equal(JSON.parse(fs.readFileSync('divrei-source-audit-repeat.json')).mode, 'already-applied');"
          node scripts/build-source-translations.mjs
          node scripts/build-library-zips.mjs
          node scripts/build-mcp-index.mjs
          node scripts/build-reviewed-connections.mjs
          node scripts/build-connected-ideas.mjs
          node scripts/build-theme-review-progress.mjs
          node scripts/test-reviewed-source-excerpt-arrays.mjs
          node scripts/test-reviewed-connections.mjs
