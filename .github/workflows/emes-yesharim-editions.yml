name: Publish the Toras Emes, Imrei Emes and Sod Yesharim editions (three books only)

# Adds Toras Emes and Imrei Emes (R. Leibele Eiger of Lublin) to the Izhbitz-Radzin shelf and replaces Sod Yesharim with its
# complete interlinear edition, over the exact current Pages artifact. Only these three books' chapter data,
# TOC/links/MCP text, the citation reverse indexes they touch, the catalogs, the MCP HaMafteach index, the offline manifest,
# the shelf descriptions and the cache markers change; every other sefer is preserved byte for byte.
# Trigger with the commit tag [emes-yesharim-editions] or workflow_dispatch.

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  deployments: read
  pages: write
  id-token: write

concurrency:
  group: ${{ (github.ref == 'refs/heads/main' && (github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[emes-yesharim-editions]'))) && 'pages' || format('emes-yesharim-skipped-{0}', github.run_id) }}
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ github.repository == 'akivagutnicki-crypto/akiva-publishing-kisvei-rav-tzadok' && github.ref == 'refs/heads/main' && (github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[emes-yesharim-editions]')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      NEW_BOOKS_SITE: .eye-site
    steps:
      - name: Checkout reader source and the editorial master edition
        uses: actions/checkout@v6

      - name: Set up Node 24
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Validate the three-book edition source
        run: node scripts/publish-emes-yesharim-editions.mjs --check-pack

      - name: Build the fresh data of the three books with the canonical library builder
        run: |
          node scripts/import-mei-vayera-bo.mjs
          node scripts/build-library.mjs
          node scripts/build-mcp-index.mjs
          node scripts/build-parallels.mjs
          rm -rf .eye-build && mv dist .eye-build
          git checkout -- dist

      - name: Identify the currently published complete Pages artifact
        id: baseline
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/new-books-release.py metadata

      - name: Download the exact current site without rebuilding the other seforim
        uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ steps.baseline.outputs.artifact }}
          run-id: ${{ steps.baseline.outputs.run }}
          repository: akivagutnicki-crypto/akiva-publishing-kisvei-rav-tzadok
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/eye-baseline
          merge-multiple: true

      - name: Safely restore every published book and site file
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import os,pathlib,tarfile
          root=pathlib.Path('.eye-site').resolve()
          root.mkdir(exist_ok=True)
          archive=pathlib.Path(os.environ['RUNNER_TEMP'])/'eye-baseline/artifact.tar'
          assert archive.is_file(), 'Missing complete Pages archive'
          with tarfile.open(archive,'r:') as source:
              members=source.getmembers()
              for member in members:
                  target=(root/member.name).resolve()
                  assert target==root or root in target.parents, 'Path outside site'
                  assert member.isdir() or member.isfile(), 'Unsafe archive entry'
              source.extractall(root,members=members,filter='data')
          PY
          python3 scripts/new-books-release.py capture

      - name: Add Toras Emes and Imrei Emes and replace Sod Yesharim
        run: |
          node scripts/publish-emes-yesharim-editions.mjs --apply .eye-site .eye-build
          node scripts/publish-emes-yesharim-editions.mjs --finalize .eye-site
          node scripts/publish-emes-yesharim-editions.mjs --verify .eye-site .eye-build
          node --check .eye-site/library/sw.js

      - name: Recheck original live site and main branch before artifact upload
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/new-books-release.py guard

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload complete preserved site with only the three books changed
        uses: actions/upload-pages-artifact@v4
        with:
          path: .eye-site
          retention-days: 14

      - name: Recheck main and latest publication before deployment
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/new-books-release.py guard

      - name: Publish the Toras Emes, Imrei Emes and Sod Yesharim editions
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify exact public bytes of all changed reader files
        run: node scripts/publish-emes-yesharim-editions.mjs --live .eye-site

      - name: Save release and preservation verification
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: emes-yesharim-editions-verification
          retention-days: 90
          if-no-files-found: warn
          path: |
            new-books-publication.json
            new-books-baseline.json
            emes-yesharim-editions-stage.json
            artifacts/emes-yesharim-editions/
            .eye-site/library/emes-yesharim-editions-20261126-r2.json
