name: Yochai leads for the Parallels panel
# Queries the Yochai Knowledge Graph for the sources the Word editions' notes cite, keeps the outside passages that
# quote the same source, names them by Sefaria ref from the genre corpus, and commits sources/mafteach/yochai-parallels.json.
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: yochai-parallels
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Download the outside-sefarim corpus
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download genre-corpus-2026-11 -R "$GITHUB_REPOSITORY" -p 'genre-corpus.jsonl.gz'
      - name: Query Yochai and check each lead against the text
        env:
          YOCHAI_API_KEY: ${{ secrets.YOCHAI_API_KEY }}
        run: node scripts/yochai-parallels.mjs
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898732+github-actions[bot]@users.noreply.github.com"
          git add sources/mafteach/yochai-parallels.json
          git diff --cached --quiet && exit 0
          git commit -m "HaMafteach: Yochai leads for the Parallels panel [workflow-maintenance]"
          for i in 1 2 3; do git pull --rebase && git push && exit 0; sleep 10; done
          exit 1
