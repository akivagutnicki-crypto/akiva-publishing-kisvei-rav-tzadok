name: Validate Tzidkat 2141 Footnotes

on:
  push:
    branches: [tzidkat-2141-expanded-source]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Import reviewed sources
        run: node scripts/import-tzidkat-reviewed.mjs
      - name: Build library
        run: node scripts/build-library.mjs
      - name: Verify reader and precise footnotes
        run: node scripts/test-tzidkat.mjs && node scripts/test-tzidkat-footnotes.mjs
      - name: Browser verify Hebrew footnote markers
        run: |
          npm install --no-save --package-lock=false playwright@1.62.1
          npx playwright install --with-deps chromium
          node scripts/test-tzidkat-reader-browser.mjs
