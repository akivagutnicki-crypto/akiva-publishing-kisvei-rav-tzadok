name: Prepare sealed Part 2 validation code
on:
  push:
    branches: ['review/takanas-part2-20261027']
    paths: ['.github/workflows/takanas-part2-code-transfer.yml']
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - name: Verify the code bundle and create an unreferenced review commit
        env:
          GH_TOKEN: ${{ github.token }}
          TRANSFER_URL: 'https://sdmntpreastus2.oaiusercontent.com/files/00000000-2b50-81f6-80b1-07ab33fb7412/raw?se=2026-10-27T20%3A06%3A56Z&sp=r&sv=2026-02-06&sr=b&scid=1c1e4384-672c-53f3-99be-e8de838b9180&skoid=db055408-822b-485f-92f8-bfeb3ea92408&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-27T14%3A20%3A05Z&ske=2026-10-28T14%3A20%3A05Z&sks=b&skv=2026-02-06&sig=rAtO%2BCAlSFCbAixFdD5BdfIHBa8KCBeeCLkrbaRpL5c%3D'
        run: |
          python3 - <<'PY'
          import base64,hashlib,io,json,os,pathlib,subprocess,urllib.request,zipfile
          repo='akivagutnicki-crypto/akiva-publishing-kisvei-rav-tzadok'
          def api(route,payload=None):
              data=None if payload is None else json.dumps(payload).encode()
              req=urllib.request.Request('https://api.github.com/repos/'+repo+route,data=data,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','Content-Type':'application/json','X-GitHub-Api-Version':'2022-11-28'})
              with urllib.request.urlopen(req,timeout=60) as response:return json.load(response)
          with urllib.request.urlopen(os.environ['TRANSFER_URL'],timeout=60) as response:blob=response.read()
          expected='2740cfdde099816babf879d31d0af8a0d7c2fd80b8a6cda302e3a31015dfc20b'
          assert len(blob)==19429 and hashlib.sha256(blob).hexdigest()==expected
          parent=os.environ['GITHUB_SHA']
          assert api('/git/ref/heads/review/takanas-part2-20261027')['object']['sha']==parent
          assert subprocess.check_output(['git','hash-object','.github/workflows/pages.yml'],text=True).strip()=='ed33fa89408a9ae457b4f0637bcb93d92552ce0c'
          base=api('/git/commits/'+parent)['tree']['sha']
          allowed={'.github/workflows/pages.yml','.github/workflows/takanat-part2-review.yml','scripts/publish-takanat-part2.mjs','tests/test-takanat-part2-browser.mjs'}
          entries=[]
          with zipfile.ZipFile(io.BytesIO(blob)) as archive:
              manifest=json.loads(archive.read('CODE_MANIFEST.json'))
              assert {x['path'] for x in manifest['files']}==allowed
              assert set(archive.namelist())==allowed|{'CODE_MANIFEST.json'}
              for row in manifest['files']:
                  data=archive.read(row['path'])
                  assert len(data)==row['bytes'] and hashlib.sha256(data).hexdigest()==row['sha256']
                  data.decode('utf-8')
                  stored=api('/git/blobs',{'encoding':'base64','content':base64.b64encode(data).decode()})
                  actual=hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()
                  assert stored['sha']==actual
                  entries.append({'path':row['path'],'mode':'100644','type':'blob','sha':actual})
          tree=api('/git/trees',{'base_tree':base,'tree':entries})
          commit=api('/git/commits',{'message':'Validate the sealed Part 2 continuation [takanat-part2-review]','tree':tree['sha'],'parents':[parent]})
          receipt={'status':'prepared only; no branch or publication changed','parent':parent,'commit':commit['sha'],'tree':tree['sha'],'bundleSha256':expected,'files':entries}
          pathlib.Path('prepared-part2-code.json').write_text(json.dumps(receipt,indent=2))
          print(json.dumps(receipt,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: prepared-part2-code
          path: prepared-part2-code.json
          retention-days: 60
          if-no-files-found: error
