name: Publish the Chassidus, Kabbalah, Machshava and Mussar parallels the other way (panel data only)

# Adds library/genre-reverse/ and the panel script that reads it: an outside passage opened in the reader lists the
# Rav Tzadok and Ishbitz-Radzin teachings paired with it. Nothing is rebuilt; every other published file is preserved.
# Trigger with the commit tag [genre-reverse] or workflow_dispatch.

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  deployments: read
  pages: write
  id-token: write

concurrency:
  group: ${{ (github.ref == 'refs/heads/main' && (github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[genre-reverse]'))) && 'pages' || format('genre-reverse-skipped-{0}', github.run_id) }}
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ github.repository == 'akivagutnicki-crypto/akiva-publishing-kisvei-rav-tzadok' && github.ref == 'refs/heads/main' && (github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[genre-reverse]')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      NEW_BOOKS_SITE: .genre-rev-site
    steps:
      - name: Checkout reader source and the editorial master edition
        uses: actions/checkout@v6

      - name: Set up Node 24
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Validate the reverse parallels data
        run: node scripts/publish-genre-reverse.mjs --check

      - name: Identify the currently published complete Pages artifact
        id: baseline
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/new-books-release.py metadata

      - name: Download the exact current site without rebuilding the other seforim
        uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ steps.baseline.outputs.artifact }}
          run-id: ${{ steps.baseline.outputs.run }}
          repository: akivagutnicki-crypto/akiva-publishing-kisvei-rav-tzadok
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/genre-rev-baseline
          merge-multiple: true

      - name: Safely restore every published book and site file
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import os,pathlib,tarfile
          root=pathlib.Path('.genre-rev-site').resolve()
          root.mkdir(exist_ok=True)
          archive=pathlib.Path(os.environ['RUNNER_TEMP'])/'genre-rev-baseline/artifact.tar'
          assert archive.is_file(), 'Missing complete Pages archive'
          with tarfile.open(archive,'r:') as source:
              members=source.getmembers()
              for member in members:
                  target=(root/member.name).resolve()
                  assert target==root or root in target.parents, 'Path outside site'
                  assert member.isdir() or member.isfile(), 'Unsafe archive entry'
              source.extractall(root,members=members,filter='data')
          PY
          python3 scripts/new-books-release.py capture

      - name: Add the reverse parallels and the panel script
        run: |
          node scripts/publish-genre-reverse.mjs --apply .genre-rev-site
          node scripts/publish-genre-reverse.mjs --verify .genre-rev-site
          node --check .genre-rev-site/library/sw.js
          node --check .genre-rev-site/library/mafteach-panel.js

      - name: Recheck original live site and main branch before artifact upload
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/new-books-release.py guard

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload complete preserved site with only the reverse parallels added
        uses: actions/upload-pages-artifact@v4
        with:
          path: .genre-rev-site
          retention-days: 14

      - name: Recheck main and latest publication before deployment
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/new-books-release.py guard

      - name: Publish the reverse parallels
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify exact public bytes of all changed reader files
        run: node scripts/publish-genre-reverse.mjs --live .genre-rev-site

      - name: Save release and preservation verification
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: genre-reverse-verification
          retention-days: 90
          if-no-files-found: warn
          path: |
            new-books-publication.json
            new-books-baseline.json
            genre-reverse-stage.json
            artifacts/genre-reverse/
            .genre-rev-site/library/genre-reverse-20261123.json
