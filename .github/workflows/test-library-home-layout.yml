name: Check reader homepage layout
on:
  push:
    branches: ["fix-library-machshavot-donation"]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - run: node scripts/test-library-home-layout.mjs
