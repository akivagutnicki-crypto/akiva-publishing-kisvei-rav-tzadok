name: Validate Mei HaShiloach Expanded Reader

on:
  push:
    branches: [mei-vayera-bo-english-headings-sources]
  workflow_dispatch:

permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Import new Mei parashiyos
        run: node scripts/import-mei-vayera-bo.mjs
      - name: Build reader
        run: node scripts/build-library.mjs
      - name: Validate interlinear, headings, sources and canonical passage locations
        run: node scripts/test-mei-shiloach-publication.mjs
