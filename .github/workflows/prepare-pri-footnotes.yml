name: Prepare and verify Pri Tzadik footnotes
on:
  push:
    branches: [work/pri-vayera-chayei-footnotes-929]
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Build reader for exact text comparison
        run: node scripts/build-pages.mjs && node scripts/import-mei-vayera-bo.mjs && node scripts/build-library.mjs
      - name: Assemble and verify lossless transport
        run: |
          python - <<'PY'
          import hashlib,json,lzma
          from pathlib import Path
          root=Path('incoming/pri-vayera-chayei-929')
          manifest=json.loads((root/'manifest.json').read_bytes())
          parts=sorted(root.glob('part-*.bin'))
          assert len(parts)==10
          data=b''.join(p.read_bytes() for p in parts)
          assert hashlib.sha256(data).hexdigest()==manifest['transportSHA256']
          assert hashlib.sha256(lzma.decompress(data)).hexdigest()==manifest['decodedSHA256']
          (root/'payload.xz').write_bytes(data)
          PY
          python scripts/unpack-pri-footnote-transport.py --transport incoming/pri-vayera-chayei-929/payload.xz --expected-content ca72b10d3eb7aaf160c9c1acb26f3360f10a159d432b5797e07ce9f4675b61f5 --output sources/akiva/pri-vayera-chayei-footnotes-929.json.gz
      - name: Preserve canonical footnotes on this work branch only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f sources/akiva/pri-vayera-chayei-footnotes-929.json.gz
          if ! git diff --cached --quiet; then
            git commit -m 'Store checksum-verified supplied 929 Pri Tzadik footnotes [skip ci]'
            git push origin HEAD:work/pri-vayera-chayei-footnotes-929
          fi
      - name: Apply old archive then new scoped footnotes
        run: |
          python scripts/assemble-akiva-reader-13.py
          python scripts/apply-reader-expanded-13.py
          python scripts/import-pri-vayera-chayei-footnotes.py
          python scripts/import-pri-vayera-chayei-footnotes.py
          node scripts/test-pri-vayera-chayei-reader.mjs --after-archive
      - name: Test visible footnotes on mobile and desktop
        run: |
          npm install --no-save --package-lock=false playwright@1.62.1
          npx playwright install --with-deps chromium
          node scripts/test-pri-vayera-chayei-footnotes-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pri-929-verification
          path: |
            pri-verification
            dist/library/pri-vayera-chayei-footnotes-report.json
            sources/akiva/pri-vayera-chayei-footnotes-929.json.gz
          retention-days: 7
