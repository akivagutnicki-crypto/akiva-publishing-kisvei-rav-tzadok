name: Stage Pri seasonal publishing code
on:
  push:
    branches: [work/pri-seasonal-footnotes-20261016]
    paths: [.github/workflows/stage-pri-seasonal-code.yml]
permissions:
  contents: write
jobs:
  stage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Import checksum-verified publishing patch
        run: |
          python - <<'PY'
          import hashlib,io,urllib.request,zipfile
          from pathlib import Path
          url='https://sdmntprcentralus.oaiusercontent.com/files/00000000-344c-81f5-93f3-50cc9b621877/raw?se=2026-10-16T20%3A50%3A32Z&sp=r&sv=2026-02-06&sr=b&scid=bbac9f60-45d9-58d8-85e6-8a845aa19a92&skoid=2757bbe4-5137-4324-975b-acedc0bad279&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-16T20%3A37%3A13Z&ske=2026-10-17T20%3A37%3A13Z&sks=b&skv=2026-02-06&sig=4ea7uRK1U3XB5EpHxuOkLY0R5OyvankSYDehFD8y4Jc%3D'
          data=urllib.request.urlopen(url,timeout=60).read()
          assert hashlib.sha256(data).hexdigest()=='34278d80b3cfed50f2563e613b570da643d12ffdc6f7d62a58b16a814ee42dcb'
          z=zipfile.ZipFile(io.BytesIO(data));allowed={'scripts/import-pri-seasonal-footnotes.py','scripts/test-pri-seasonal-footnotes.mjs'}
          assert set(z.namelist())==allowed
          for name in allowed:Path(name).write_bytes(z.read(name))
          raw=Path('.github/workflows/pages.yml').read_bytes()
          assert hashlib.sha1(('blob '+str(len(raw))+'\0').encode()+raw).hexdigest()=='6006ae1119f64210d690d1a449aee25b7be5adb9','Pages workflow changed; reconcile first'
          s=raw.decode()
          anchor='      - name: Build and verify library ZIP downloads\n'
          assert s.count(anchor)==1
          s=s.replace(anchor,'      - name: Merge supplied Kislev Chanukah Shevat and Tu BiShvat source footnotes\n        run: |\n          python scripts/import-pri-seasonal-footnotes.py\n          node scripts/build-mcp-index.mjs\n          node scripts/test-mcp-server.mjs\n          node scripts/test-pri-seasonal-footnotes.mjs\n\n'+anchor)
          old='      - name: Verify Pri Tzaddik Shevat and Tu BiShvat text and Word edition in offline downloads\n        run: node scripts/test-pri-shevat-tubishvat.mjs --zips'
          assert old in s
          s=s.replace(old,'      - name: Verify seasonal source notes preserved chapters and exact Word editions in offline downloads\n        run: node scripts/test-pri-seasonal-footnotes.mjs --zips')
          anchor='      - name: Save Pri Tzadik live verification report and screenshots\n'
          assert s.count(anchor)==1
          s=s.replace(anchor,'      - name: Verify all four seasonal groups and footnote popups on the live reader\n        run: |\n          for attempt in 1 2 3; do\n            if node scripts/test-pri-seasonal-footnotes.mjs --url \'https://akivagutnicki-crypto.github.io/akiva-publishing-kisvei-rav-tzadok/library/\'; then\n              exit 0\n            fi\n            sleep 20\n          done\n          exit 1\n\n      - name: Save seasonal live reader verification\n        if: always()\n        uses: actions/upload-artifact@v4\n        with:\n          name: pri-seasonal-live-verification\n          path: |\n            seasonal-verification\n            dist/library/pri-seasonal-footnotes-report.json\n          retention-days: 14\n\n'+anchor)
          Path('incoming/pri-seasonal-pages.yml').write_text(s)
          PY
          python -m py_compile scripts/import-pri-seasonal-footnotes.py
          node --check scripts/test-pri-seasonal-footnotes.mjs
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/import-pri-seasonal-footnotes.py scripts/test-pri-seasonal-footnotes.mjs incoming/pri-seasonal-pages.yml
          git commit -m 'Stage scoped seasonal source-note importer and publication checks [skip ci]'
          git push origin HEAD:work/pri-seasonal-footnotes-20261016
