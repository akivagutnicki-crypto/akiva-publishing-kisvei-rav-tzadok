name: Publish Rav Tzadok's kuntresim as books (four books only)

# Adds Levushei Tzedakah, Iggeres HaKodesh, Likkutei Torah on Shabbos and the Tumas Ohel responsum to the Rav Tzadok HaKohen
# shelf as books of their own, over the exact current Pages artifact. Only these four books' chapter data, TOC/links/MCP
# text, the citation reverse indexes they touch, the catalogs, the MCP HaMafteach index, the offline manifest, the shelf
# descriptions, their Word downloads and the cache markers change; every other sefer is preserved byte for byte.
# Trigger with the commit tag [kuntresim-editions] or workflow_dispatch.

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  deployments: read
  pages: write
  id-token: write

concurrency:
  group: ${{ (github.ref == 'refs/heads/main' && (github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[kuntresim-editions]'))) && 'pages' || format('kuntresim-skipped-{0}', github.run_id) }}
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ github.repository == 'akivagutnicki-crypto/akiva-publishing-kisvei-rav-tzadok' && github.ref == 'refs/heads/main' && (github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[kuntresim-editions]')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      NEW_BOOKS_SITE: .kun-site
    steps:
      - name: Checkout reader source and the editorial master edition
        uses: actions/checkout@v6

      - name: Set up Node 24
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Validate the four-book edition source
        run: node scripts/publish-kuntresim-editions.mjs --check-pack

      - name: Build the fresh data of the four books with the canonical library builder
        run: |
          node scripts/import-mei-vayera-bo.mjs
          node scripts/build-library.mjs
          node scripts/build-mcp-index.mjs
          node scripts/build-parallels.mjs
          rm -rf .kun-build && mv dist .kun-build
          git checkout -- dist

      - name: Identify the currently published complete Pages artifact
        id: baseline
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/new-books-release.py metadata

      - name: Download the exact current site without rebuilding the other seforim
        uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ steps.baseline.outputs.artifact }}
          run-id: ${{ steps.baseline.outputs.run }}
          repository: akivagutnicki-crypto/akiva-publishing-kisvei-rav-tzadok
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/kun-baseline
          merge-multiple: true

      - name: Safely restore every published book and site file
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import os,pathlib,tarfile
          root=pathlib.Path('.kun-site').resolve()
          root.mkdir(exist_ok=True)
          archive=pathlib.Path(os.environ['RUNNER_TEMP'])/'kun-baseline/artifact.tar'
          assert archive.is_file(), 'Missing complete Pages archive'
          with tarfile.open(archive,'r:') as source:
              members=source.getmembers()
              for member in members:
                  target=(root/member.name).resolve()
                  assert target==root or root in target.parents, 'Path outside site'
                  assert member.isdir() or member.isfile(), 'Unsafe archive entry'
              source.extractall(root,members=members,filter='data')
          PY
          python3 scripts/new-books-release.py capture

      - name: Add Levushei Tzedakah, Iggeres HaKodesh, Likkutei Torah on Shabbos and the Tumas Ohel responsum
        run: |
          node scripts/publish-kuntresim-editions.mjs --apply .kun-site .kun-build
          node scripts/publish-kuntresim-editions.mjs --finalize .kun-site
          node scripts/publish-kuntresim-editions.mjs --verify .kun-site .kun-build
          node --check .kun-site/library/sw.js

      - name: Recheck original live site and main branch before artifact upload
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/new-books-release.py guard

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload complete preserved site with only the four books changed
        uses: actions/upload-pages-artifact@v4
        with:
          path: .kun-site
          retention-days: 14

      - name: Recheck main and latest publication before deployment
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/new-books-release.py guard

      - name: Publish Rav Tzadok's kuntresim
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify exact public bytes of all changed reader files
        run: node scripts/publish-kuntresim-editions.mjs --live .kun-site

      - name: Save release and preservation verification
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kuntresim-editions-verification
          retention-days: 90
          if-no-files-found: warn
          path: |
            new-books-publication.json
            new-books-baseline.json
            kuntresim-editions-stage.json
            artifacts/kuntresim-editions/
            .kun-site/library/kuntresim-editions-20261126-r3.json
