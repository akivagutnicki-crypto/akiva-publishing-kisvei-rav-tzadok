name: Validate Takanat HaShavin review without publishing

on:
  push:
    branches: ["codex/takanat-reader-review-20261026"]
  workflow_dispatch:

# This workflow can read the current publication artifact and upload validation
# evidence. It has no Pages permission, no OIDC permission, and no deploy step.
permissions:
  contents: read
  actions: read

concurrency:
  group: takanat-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    if: ${{ github.repository == 'akivagutnicki-crypto/akiva-publishing-kisvei-rav-tzadok' && github.ref == 'refs/heads/codex/takanat-reader-review-20261026' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      TZ: UTC
    steps:
      - name: Check out the exact nondefault review branch commit
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Validate the sealed review and capture current main and publication
        id: baseline
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          node scripts/publish-takanat-reader-review.mjs --prepare
          mkdir -p artifacts/takanat-reader-review
          node tests/test-takanat-reader-review.mjs --guards-only > artifacts/takanat-reader-review/pack-guards.json
          node tests/test-takanat-native-audit.mjs
          node scripts/publish-takanat-reader-review.mjs --review-metadata

      - name: Download the actual current complete publication artifact
        uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ steps.baseline.outputs.artifact }}
          run-id: ${{ steps.baseline.outputs.run }}
          repository: akivagutnicki-crypto/akiva-publishing-kisvei-rav-tzadok
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/takanat-validation-baseline
          merge-multiple: true

      - name: Restore the artifact into an isolated validation candidate
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import os, pathlib, shutil, tarfile
          root = pathlib.Path('dist').resolve()
          if root.exists(): shutil.rmtree(root)
          root.mkdir()
          archive = pathlib.Path(os.environ['RUNNER_TEMP']) / 'takanat-validation-baseline/artifact.tar'
          with tarfile.open(archive, 'r:') as source:
              members = source.getmembers()
              for member in members:
                  target = (root / member.name).resolve()
                  assert target == root or root in target.parents, 'Unsafe artifact path'
                  assert member.isdir() or member.isfile(), 'Unexpected archive link'
              source.extractall(root, members=members, filter='data')
          PY
          node scripts/publish-takanat-reader-review.mjs --review-capture

      - name: Apply the reviewed change to the isolated candidate and verify all data
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          node scripts/publish-takanat-reader-review.mjs --review-apply
          node tests/test-takanat-reader-review.mjs --data-only --guard-proof artifacts/takanat-reader-review/pack-guards.json
          node --check dist/library/sw.js

      - name: Install desktop and phone browser verification
        run: |
          npm install --no-save --package-lock=false playwright@1.62.1
          browser_candidate="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)"
          if [ -n "$browser_candidate" ]; then
            printf 'AKIVA_CHROMIUM_EXECUTABLE=%s\n' "$browser_candidate" >> "$GITHUB_ENV"
          else
            npx playwright install --with-deps chromium
          fi

      - name: Verify all sixteen sections and full notes on desktop and phone
        run: node tests/test-takanat-reader-review.mjs --guard-proof artifacts/takanat-reader-review/pack-guards.json

      - name: Confirm main and the public reader stayed unchanged and save the review result
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/publish-takanat-reader-review.mjs --review-summary

      - name: Upload review evidence without publishing the candidate
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: takanat-reader-review-validation
          retention-days: 90
          if-no-files-found: warn
          path: |
            takanat-reader-review-validation-publication.json
            takanat-reader-review-validation-baseline.json
            takanat-reader-review-validation-summary.json
            dist/library/takanat-reader-review-20261026.json
            artifacts/takanat-reader-review/
