name: MCP health check (live server)

# Calls every tool of the live Kisvei Rav Tzadok MCP server, as Claude does, after each publication and every six hours.
# On failure it opens (or updates) an issue labelled mcp-health, so GitHub emails the owner; on recovery it closes it.
on:
  schedule:
    - cron: '23 */6 * * *'
  workflow_run:
    workflows:
      - 'Publish Parallels panel and HaMafteach MCP data (preserve live site)'
      - 'Deploy Akiva Publishing to GitHub Pages'
      - 'Publish Pri Tzaddik Moadim interlinear editions (Iyar–Menachem Av, Elul–Sukkos)'
      - 'Publish Pri Tzaddik Daled Parshiyos and Purim interlinear edition'
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: mcp-health
  cancel-in-progress: true

jobs:
  check:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Wait for the new publication to reach the CDN
        if: ${{ github.event_name == 'workflow_run' }}
        run: sleep 120
      - name: Call every tool on the live server
        id: check
        run: |
          set -o pipefail
          node scripts/check-live-mcp.mjs 2>&1 | tee health.txt || { sleep 90; echo "--- retry ---" | tee -a health.txt; node scripts/check-live-mcp.mjs 2>&1 | tee -a health.txt; }
      - name: Open or update the mcp-health issue
        if: ${{ failure() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh label create mcp-health --color B60205 --description "Live MCP server health check" 2>/dev/null || true
          body="$(printf 'The live MCP health check failed (%s, run %s).\n\n```\n%s\n```\n' "$(date -u +%FT%TZ)" "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" "$(tail -c 6000 health.txt)")"
          n=$(gh issue list --label mcp-health --state open --json number -q '.[0].number')
          if [ -n "$n" ]; then gh issue comment "$n" --body "$body"; else gh issue create --title "MCP server health check failing" --label mcp-health --body "$body"; fi
      - name: Close the mcp-health issue on recovery
        if: ${{ success() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for n in $(gh issue list --label mcp-health --state open --json number -q '.[].number'); do
            gh issue close "$n" --comment "Recovered: all live MCP calls succeed again ($(date -u +%FT%TZ))."
          done
