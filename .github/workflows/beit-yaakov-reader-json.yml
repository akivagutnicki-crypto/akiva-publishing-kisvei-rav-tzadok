name: Publish Beis Yaakov complete reader JSON only

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  deployments: read
  pages: write
  id-token: write

concurrency:
  group: ${{ (github.ref == 'refs/heads/main' && (github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[beit-yaakov-reader-json]'))) && 'pages' || format('beit-yaakov-skipped-{0}', github.run_id) }}
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ github.repository == 'akivagutnicki-crypto/akiva-publishing-kisvei-rav-tzadok' && github.ref == 'refs/heads/main' && (github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[beit-yaakov-reader-json]')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      NEW_BOOKS_SITE: .beit-site
    steps:
      - name: Checkout reader source and audited interlinear manuscript
        uses: actions/checkout@v6

      - name: Set up Node 24
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Validate all five parashiyot and their original Hebrew-English pairs
        run: node scripts/publish-beit-yaakov-final.mjs --check-pack

      - name: Identify the currently published complete Pages artifact
        id: baseline
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/new-books-release.py metadata

      - name: Download exact current site without rebuilding the library
        uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ steps.baseline.outputs.artifact }}
          run-id: ${{ steps.baseline.outputs.run }}
          repository: akivagutnicki-crypto/akiva-publishing-kisvei-rav-tzadok
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/beit-baseline
          merge-multiple: true

      - name: Safely restore every published book and site file
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import os,pathlib,tarfile
          root=pathlib.Path('.beit-site').resolve()
          root.mkdir(exist_ok=True)
          archive=pathlib.Path(os.environ['RUNNER_TEMP'])/'beit-baseline/artifact.tar'
          assert archive.is_file(), 'Missing complete Pages archive'
          with tarfile.open(archive,'r:') as source:
              members=source.getmembers()
              for member in members:
                  target=(root/member.name).resolve()
                  assert target==root or root in target.parents, 'Path outside site'
                  assert member.isdir() or member.isfile(), 'Unsafe archive entry'
              source.extractall(root,members=members,filter='data')
          PY
          python3 scripts/new-books-release.py capture

      - name: Add 257 checked Beis Yaakov osiyos and Sefaria connections only
        run: |
          node scripts/publish-beit-yaakov-final.mjs --apply .beit-site
          node scripts/publish-beit-yaakov-final.mjs --verify .beit-site
          node --check .beit-site/library/sw.js

      - name: Recheck original live site and main branch before artifact upload
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/new-books-release.py guard

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload complete preserved site with only Beis Yaakov reader additions
        uses: actions/upload-pages-artifact@v4
        with:
          path: .beit-site
          retention-days: 14

      - name: Recheck main and latest publication before deployment
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/new-books-release.py guard

      - name: Publish Beis Yaakov reader
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify exact public bytes of all changed reader files
        run: node scripts/publish-beit-yaakov-final.mjs --live

      - name: Save release and preservation verification
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: beit-yaakov-reader-json-verification
          retention-days: 90
          if-no-files-found: warn
          path: |
            new-books-publication.json
            new-books-baseline.json
            artifacts/beit-yaakov-reader-json/
            .beit-site/library/beit-yaakov-reader-20261025.json
