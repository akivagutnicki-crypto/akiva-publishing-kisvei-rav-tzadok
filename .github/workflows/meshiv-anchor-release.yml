name: Repair the Meshiv note anchors (book only)

# Meshiv HaTa'anah and Meshiv Tzedek anchor 557 phrase-closing notes after the phrase's trailing
# space, one character past the trimmed phrase the reader and MCP text use. This book-only
# publisher restores the exact live site, moves those anchors to the end of the trimmed phrase
# (scripts/fix-meshiv-note-anchors.mjs), rebuilds the MCP text (strict for both Meshiv books),
# the parallels and the offline ZIPs, and deploys. Trigger with [meshiv-anchor-release].

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  deployments: read
  pages: write
  id-token: write

concurrency:
  group: ${{ (github.ref == 'refs/heads/main' && (github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[meshiv-anchor-release]'))) && 'pages' || format('meshiv-anchor-skipped-{0}', github.run_id) }}
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ github.repository == 'akivagutnicki-crypto/akiva-publishing-kisvei-rav-tzadok' && github.ref == 'refs/heads/main' && (github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[meshiv-anchor-release]')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      NEW_BOOKS_SITE: .meshiv-site
    steps:
      - name: Checkout the reader source
        uses: actions/checkout@v6

      - name: Set up Node 24
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Identify the currently published complete Pages artifact
        id: baseline
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/new-books-release.py metadata

      - name: Download the exact current site without rebuilding the other seforim
        uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ steps.baseline.outputs.artifact }}
          run-id: ${{ steps.baseline.outputs.run }}
          repository: akivagutnicki-crypto/akiva-publishing-kisvei-rav-tzadok
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/meshiv-baseline
          merge-multiple: true

      - name: Safely restore every published book and site file
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import os,pathlib,tarfile
          root=pathlib.Path('.meshiv-site').resolve()
          root.mkdir(exist_ok=True)
          archive=pathlib.Path(os.environ['RUNNER_TEMP'])/'meshiv-baseline/artifact.tar'
          assert archive.is_file(), 'Missing complete Pages archive'
          with tarfile.open(archive,'r:') as source:
              members=source.getmembers()
              for member in members:
                  target=(root/member.name).resolve()
                  assert target==root or root in target.parents, 'Path outside site'
                  assert member.isdir() or member.isfile(), 'Unsafe archive entry'
              source.extractall(root,members=members,filter='data')
          PY
          python3 scripts/new-books-release.py capture

      - name: Repair only the Meshiv anchors, then rebuild the MCP text, parallels and ZIP downloads
        run: |
          mv dist .dist-repo
          ln -s .meshiv-site dist
          set +e
          (
            set -e
            node scripts/fix-meshiv-note-anchors.mjs dist/library/data | tee meshiv-anchor-report.txt
            MCP_TOLERATE_FOREIGN_ANCHORS=1 MCP_STRICT_REF_PREFIX="Meshiv HaTa'anah|Meshiv Tzedek" node scripts/build-mcp-index.mjs
            node scripts/build-parallels.mjs
            node scripts/build-library-zips.mjs
            node --input-type=module -e "import fs from 'node:fs';const c=JSON.parse(fs.readFileSync('dist/mcp-data/catalog.json'));c.version=JSON.parse(fs.readFileSync('dist/library/data/files.json')).version;fs.writeFileSync('dist/mcp-data/catalog.json',JSON.stringify(c));"
          )
          status=$?
          rm dist && mv .dist-repo dist
          exit $status

      - name: Recheck original live site and main branch before artifact upload
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/new-books-release.py guard

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload complete preserved site with only the Meshiv anchor repair
        uses: actions/upload-pages-artifact@v4
        with:
          path: .meshiv-site
          retention-days: 14

      - name: Recheck main and latest publication before deployment
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/new-books-release.py guard

      - name: Publish the Meshiv anchor repair
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify the repaired anchors are live
        run: |
          for attempt in $(seq 1 18); do
            if curl -fsS "https://akivagutnicki-crypto.github.io/akiva-publishing-kisvei-rav-tzadok/library/data/meshiv-hata-anah/0.json?check=$(date +%s%N)" | python3 -c "import json,sys;r=json.load(sys.stdin);f=[n for x in r for n in x.get('footnotes',[]) if n.get('sourceId')=='MHT-0001'][0];assert not f['heAnchorPrefix'].endswith(' ');print('live',f['heCharOffset'])"; then exit 0; fi
            sleep 10
          done
          exit 1

      - name: Save release verification
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: meshiv-anchor-release-verification
          retention-days: 90
          if-no-files-found: warn
          path: |
            new-books-publication.json
            new-books-baseline.json
            meshiv-anchor-report.txt
