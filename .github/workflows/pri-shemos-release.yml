name: Publish complete Pri Tzaddik Shemos Word edition

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ (github.ref == 'refs/heads/main' && (github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[pri-shemos-release]'))) && 'pages' || format('pri-shemos-skipped-{0}', github.run_id) }}
  cancel-in-progress: false

jobs:
  publish:
    if: ${{ github.repository == 'akivagutnicki-crypto/akiva-publishing-kisvei-rav-tzadok' && github.ref == 'refs/heads/main' && (github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[pri-shemos-release]')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      actions: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out the exact publication source
        uses: actions/checkout@v6
      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Import both complete Word volumes and prove every native footnote anchor
        run: |
          python3 scripts/pri-shemos/build.py
          python3 scripts/pri-shemos/verify.py
      - name: Identify the actual current complete publication
        id: baseline
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/pri-shemos/release.py metadata
      - name: Download the complete current Pages artifact
        uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ steps.baseline.outputs.artifact }}
          run-id: ${{ steps.baseline.outputs.run }}
          repository: akivagutnicki-crypto/akiva-publishing-kisvei-rav-tzadok
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/shemos-baseline
          merge-multiple: true
      - name: Restore every current published file safely
        run: |
          python3 - <<'PY'
          import os, pathlib, shutil, tarfile
          root = pathlib.Path('dist').resolve()
          if root.exists(): shutil.rmtree(root)
          root.mkdir()
          archive = pathlib.Path(os.environ['RUNNER_TEMP']) / 'shemos-baseline/artifact.tar'
          with tarfile.open(archive, 'r:') as source:
              members = source.getmembers()
              for member in members:
                  target = (root / member.name).resolve()
                  assert target == root or root in target.parents
                  assert member.isdir() or member.isfile()
              source.extractall(root, members=members, filter='data')
          PY
          python3 scripts/pri-shemos/release.py capture dist
      - name: Add the Word edition and synchronize the Reader MCP and both text archives
        run: |
          python3 scripts/pri-shemos/release.py apply dist
          python3 scripts/pri-shemos/release.py exports dist
          python3 scripts/pri-shemos/verify.py dist --archives
          python3 scripts/pri-shemos/release.py seal dist
          node --check dist/library/sw.js
      - name: Install browser verification
        run: |
          npm install --no-save --package-lock=false playwright@1.62.1
          browser_candidate="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)"
          if [ -n "$browser_candidate" ]; then
            printf 'AKIVA_CHROMIUM_EXECUTABLE=%s\n' "$browser_candidate" >> "$GITHUB_ENV"
          else
            npx playwright install --with-deps chromium
          fi
      - name: Verify every imported chapter and Hebrew footnote in the desktop and mobile Reader
        run: node scripts/pri-shemos/test-browser.mjs
      - name: Recheck main and the current publication before upload
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/pri-shemos/release.py guard
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload the complete preserved publication
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist
          retention-days: 14
      - name: Recheck main and the current publication before deployment
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/pri-shemos/release.py guard
      - name: Publish the complete Pri Tzaddik Shemos edition
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Read back every published changed file and verify the live Reader
        run: |
          python3 scripts/pri-shemos/release.py live
          node scripts/pri-shemos/test-browser.mjs --url 'https://akivagutnicki-crypto.github.io/akiva-publishing-kisvei-rav-tzadok/library/'
      - name: Save the publication and complete verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pri-shemos-publication-verification
          retention-days: 90
          if-no-files-found: warn
          path: |
            pri-shemos-release-state.json
            pri-shemos-release-report.json
            pri-shemos-live-verification.json
            sources/akiva/overlays/pri-shemos-20261104/manifest.json
            artifacts/pri-shemos/
