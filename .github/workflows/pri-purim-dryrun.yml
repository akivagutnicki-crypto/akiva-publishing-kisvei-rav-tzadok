name: Dry run of the Pri Tzaddik Daled Parshiyos and Purim reader edition

on:
  push:
    branches: [pri-purim-edition]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  dryrun:
    if: ${{ github.repository == 'akivagutnicki-crypto/akiva-publishing-kisvei-rav-tzadok' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out the exact publication source
        uses: actions/checkout@v6
      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Import the Word edition and prove every native footnote anchor
        run: |
          python3 scripts/pri-purim/build.py
          python3 scripts/pri-purim/verify.py
      - name: Find the current Pages publication
        id: baseline
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import importlib.util, json, os
          spec = importlib.util.spec_from_file_location('r', 'scripts/pri-purim/release.py'); R = importlib.util.module_from_spec(spec); spec.loader.exec_module(R)
          p = R.latest(); print(json.dumps(p))
          with open(os.environ['GITHUB_OUTPUT'], 'a') as out: out.write(f"artifact={p['artifact']}\nrun={p['run']}\n")
          PY
      - name: Download the complete current Pages artifact
        uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ steps.baseline.outputs.artifact }}
          run-id: ${{ steps.baseline.outputs.run }}
          repository: akivagutnicki-crypto/akiva-publishing-kisvei-rav-tzadok
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/purim-baseline
          merge-multiple: true
      - name: Restore every current published file safely
        run: |
          python3 - <<'PY'
          import os, pathlib, shutil, tarfile
          root = pathlib.Path('dist').resolve()
          if root.exists(): shutil.rmtree(root)
          root.mkdir()
          archive = pathlib.Path(os.environ['RUNNER_TEMP']) / 'purim-baseline/artifact.tar'
          with tarfile.open(archive, 'r:') as source:
              members = source.getmembers()
              for member in members:
                  target = (root / member.name).resolve()
                  assert target == root or root in target.parents
                  assert member.isdir() or member.isfile()
              source.extractall(root, members=members, filter='data')
          PY
          python3 scripts/pri-purim/release.py capture dist
      - name: Add the edition, rebuild the MCP search index and chunks, pass the MCP budget, synchronize both text archives
        run: |
          python3 scripts/pri-purim/release.py apply dist
          python3 scripts/pri-purim/release.py exports dist
          python3 scripts/pri-purim/verify.py dist --archives
          python3 scripts/pri-purim/release.py seal dist
          node --check dist/library/sw.js
      - name: Install browser verification
        run: |
          npm install --no-save --package-lock=false playwright@1.62.1
          browser_candidate="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)"
          if [ -n "$browser_candidate" ]; then
            printf 'AKIVA_CHROMIUM_EXECUTABLE=%s\n' "$browser_candidate" >> "$GITHUB_ENV"
          else
            npx playwright install --with-deps chromium
          fi
      - name: Verify every imported chapter and footnote in the desktop and mobile Reader
        run: node scripts/pri-purim/test-browser.mjs
      - name: Save the dry-run evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pri-purim-dryrun-verification
          retention-days: 14
          if-no-files-found: warn
          path: |
            pri-purim-release-report.json
            artifacts/pri-purim/
