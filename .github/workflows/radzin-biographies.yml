name: Publish the five Radzin books (five books only)

# Adds five original Akiva Publishing books on the Radzin rebbes to the Izhbitz-Radzin shelf, over the exact
# current Pages artifact; every other sefer is preserved byte for byte.
# Trigger with the commit tag [radzin-biographies] or workflow_dispatch.

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  deployments: read
  pages: write
  id-token: write

concurrency:
  group: ${{ (github.ref == 'refs/heads/main' && (github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[radzin-biographies]'))) && 'pages' || format('radzin-biographies-skipped-{0}', github.run_id) }}
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ github.repository == 'akivagutnicki-crypto/akiva-publishing-kisvei-rav-tzadok' && github.ref == 'refs/heads/main' && (github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[radzin-biographies]')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      NEW_BOOKS_SITE: .rzb-site
    steps:
      - name: Checkout reader source and the editorial master edition
        uses: actions/checkout@v6

      - name: Set up Node 24
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Validate the five books
        run: node scripts/publish-radzin-biographies.mjs --check-pack

      - name: Build the fresh data of the five books with the canonical library builder
        run: |
          node scripts/import-mei-vayera-bo.mjs
          node scripts/build-library.mjs
          node scripts/build-mcp-index.mjs
          node scripts/build-parallels.mjs
          rm -rf .rzb-build && mv dist .rzb-build
          git checkout -- dist

      - name: Identify the currently published complete Pages artifact
        id: baseline
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/new-books-release.py metadata

      - name: Download the exact current site without rebuilding the other seforim
        uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ steps.baseline.outputs.artifact }}
          run-id: ${{ steps.baseline.outputs.run }}
          repository: akivagutnicki-crypto/akiva-publishing-kisvei-rav-tzadok
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/rzb-baseline
          merge-multiple: true

      - name: Safely restore every published book and site file
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import os,pathlib,tarfile
          root=pathlib.Path('.rzb-site').resolve()
          root.mkdir(exist_ok=True)
          archive=pathlib.Path(os.environ['RUNNER_TEMP'])/'rzb-baseline/artifact.tar'
          assert archive.is_file(), 'Missing complete Pages archive'
          with tarfile.open(archive,'r:') as source:
              members=source.getmembers()
              for member in members:
                  target=(root/member.name).resolve()
                  assert target==root or root in target.parents, 'Path outside site'
                  assert member.isdir() or member.isfile(), 'Unsafe archive entry'
              source.extractall(root,members=members,filter='data')
          PY
          python3 scripts/new-books-release.py capture

      - name: Add the five books
        run: |
          node scripts/publish-radzin-biographies.mjs --apply .rzb-site .rzb-build
          node scripts/publish-radzin-biographies.mjs --finalize .rzb-site
          node scripts/publish-radzin-biographies.mjs --verify .rzb-site .rzb-build
          node --check .rzb-site/library/sw.js

      - name: Recheck original live site and main branch before artifact upload
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/new-books-release.py guard

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload complete preserved site with only the eight books changed
        uses: actions/upload-pages-artifact@v4
        with:
          path: .rzb-site
          retention-days: 14

      - name: Recheck main and latest publication before deployment
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/new-books-release.py guard

      - name: Publish the Rav Tzadok and Sidrei Taharos editions
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify exact public bytes of all changed reader files
        run: node scripts/publish-radzin-biographies.mjs --live .rzb-site

      - name: Save release and preservation verification
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: radzin-biographies-verification
          retention-days: 90
          if-no-files-found: warn
          path: |
            new-books-publication.json
            new-books-baseline.json
            radzin-biographies-stage.json
            artifacts/radzin-biographies/
            .rzb-site/library/radzin-biographies-20261126.json
